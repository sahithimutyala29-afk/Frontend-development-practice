<body>
    <script>
        let num = prompt("Enter a number:");
        if(num>96){
            console.log( num + "is a not valid number");
        } else if(num%96==0) {
            console.log(num + " is not divisible by 96.");
        }
        else{
            console.log(num + " is not a valid number.");
        }
    </script>
