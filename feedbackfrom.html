<!DOCTYPE html>
<html>
<head>
    <title>Feedback Form</title>
</head>
<body>
    <h1>Feedback Form</h1>
    <form>
        <label>Name:</label>
        <input type="text" placeholder="Enter your name">
        <br><br>

        <label>Email:</label>
        <input type="email" placeholder="Enter your email">
        <br><br>
        <label>How was your experience?</label>
        <select>
            <option>Excellent</option>
            <option>Good</option>
            <option>Average</option>
            <option>Poor</option>
        </select>
        <br><br>
        <label>Write your feedback:</label>
        <br>
        <textarea rows="5" cols="40" placeholder="Enter your feedback"></textarea>
        <br><br>
        <label>Suggestions:</label>
        <br>
        <textarea rows="5" cols="40" placeholder="Enter your suggestions"></textarea>
        <br><br>
        <input type="submit" value="Submit Feedback">
    </form>
</body>
</html>
