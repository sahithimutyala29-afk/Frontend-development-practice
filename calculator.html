<!DOCTYPE html>
<html>
<head>
    <title>Normal Calculator</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }

        .calculator {
            background-color: white;
            width: 700px;
            margin: 50px auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 20px gray;
        }

        h1 {
            font-size: 35px;
            margin-bottom: 30px;
        }

        .numbers {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .numbers input {
            width: 50%;
            padding: 20px;
            font-size: 20px;
            border: 2px solid gray;
            border-radius: 8px;
        }

        .operations {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .operations button {
            padding: 25px;
            font-size: 22px;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .add {
            background-color: #4CAF50;
        }

        .sub {
            background-color: #2196F3;
        }

        .mul {
            background-color: #FF9800;
        }

        .div {
            background-color: #9C27B0;
        }

        .operations button:hover {
            opacity: 0.7;
            transform: scale(1.03);
        }

        #result {
            margin-top: 30px;
            padding: 20px;
            font-size: 25px;
            font-weight: bold;
            background-color: #f2f2f2;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h1>Simple Calculator</h1>

        <div class="numbers">

            <input type="number" id="num1" placeholder="Enter Number 1">

            <input type="number" id="num2" placeholder="Enter Number 2">

        </div>

        <div class="operations">

            <button class="add" onclick="addition()">Addition (+)</button>

            <button class="sub" onclick="subtraction()">Subtraction (-)</button>

            <button class="mul" onclick="multiplication()">Multiplication (×)</button>

            <button class="div" onclick="division()">Division (÷)</button>

        </div>

        <div id="result">
            Result will appear here
        </div>

    </div>

    <script>

        function addition() {
            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);
            document.getElementById("result").innerHTML = "Result: " + (a + b);
        }

        function subtraction() {
            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);
            document.getElementById("result").innerHTML = "Result: " + (a - b);
        }

        function multiplication() {
            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);
            document.getElementById("result").innerHTML = "Result: " + (a * b);
        }

        function division() {
            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);
            document.getElementById("result").innerHTML = "Result: " + (a / b);
        }

    </script>

</body>
</html>
