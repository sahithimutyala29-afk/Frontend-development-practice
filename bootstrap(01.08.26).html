<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Components</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">My Website</a>

        <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="#">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Services</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Contact</a>
                </li>
            </ul>
        </div>
    </div>
</nav>



<div class="container mt-4">

<div id="slider" class="carousel slide" data-bs-ride="carousel">

    <div class="carousel-inner">

        <div class="carousel-item active">
            <img src="https://picsum.photos/900/350?random=1"
            class="d-block w-100">
        </div>

        <div class="carousel-item">
            <img src="https://picsum.photos/900/350?random=2"
            class="d-block w-100">
        </div>

        <div class="carousel-item">
            <img src="https://picsum.photos/900/350?random=3"
            class="d-block w-100">
        </div>

    </div>

    <button class="carousel-control-prev"
        type="button"
        data-bs-target="#slider"
        data-bs-slide="prev">

        <span class="carousel-control-prev-icon"></span>

    </button>

    <button class="carousel-control-next"
        type="button"
        data-bs-target="#slider"
        data-bs-slide="next">

        <span class="carousel-control-next-icon"></span>

    </button>

</div>

</div>


<div class="container mt-5">

<ul class="nav nav-tabs">

<li class="nav-item">
<button class="nav-link active"
data-bs-toggle="tab"
data-bs-target="#home">
Home
</button>
</li>

<li class="nav-item">
<button class="nav-link"
data-bs-toggle="tab"
data-bs-target="#about">
About
</button>
</li>

<li class="nav-item">
<button class="nav-link"
data-bs-toggle="tab"
data-bs-target="#contact">
Contact
</button>
</li>

</ul>

<div class="tab-content border p-3">

<div class="tab-pane fade show active" id="home">
<h4>Home</h4>
<p>Welcome to Home Tab.</p>
</div>

<div class="tab-pane fade" id="about">
<h4>About</h4>
<p>This is About Tab.</p>
</div>

<div class="tab-pane fade" id="contact">
<h4>Contact</h4>
<p>Contact us at example@email.com</p>
</div>

</div>

</div>


<div class="container mt-5 mb-5">

<div class="accordion" id="myAccordion">

<div class="accordion-item">

<h2 class="accordion-header">

<button class="accordion-button"
data-bs-toggle="collapse"
data-bs-target="#one">

Question 1

</button>
</h2>
<div id="one"
class="accordion-collapse collapse show"
data-bs-parent="#myAccordion">
<div class="accordion-body">
Bootstrap is a front-end framework.
</div>
</div>
</div>
<div class="accordion-item">
<h2 class="accordion-header">
<button class="accordion-button collapsed"
data-bs-toggle="collapse"
data-bs-target="#two">
Question 2
</button>
</h2>
<div id="two"
class="accordion-collapse collapse"
data-bs-parent="#myAccordion">
<div class="accordion-body">
It is used to build responsive websites.
</div>
</div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
